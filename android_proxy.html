<!DOCTYPE html>
<html>
<head><title>proxy</title></head>
<body>
<script>
// WebView HTTP 代理：通过 CORS 代理转发请求到 Supabase
// corsproxy.io 不在 Cloudflare 上，不会被 DPI 封锁
window.proxyFetch = async function(url, method, headers, bodyBase64) {
    // 记录所有错误细节
    var errors = [];
    // Supabase 请求走 CORS 代理
    var proxyUrl = url;
    if (url.indexOf('supabase.co') !== -1) {
        proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(url);
    }
    try {
        var body = bodyBase64 ? atob(bodyBase64) : null;
        var options = { method: method, headers: headers };
        if (body) options.body = body;
        var response = await fetch(proxyUrl, options);
        var arrayBuffer = await response.arrayBuffer();
        var bytes = new Uint8Array(arrayBuffer);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        var base64 = btoa(binary);
        var respHeaders = {};
        response.headers.forEach(function(v, k) { respHeaders[k] = v; });
        return JSON.stringify({
            statusCode: response.status,
            headers: respHeaders,
            body: base64
        });
    } catch(e) {
        // 返回完整错误信息（包括 stack）
        return JSON.stringify({
            error: e.message,
            name: e.name,
            stack: e.stack ? e.stack.substring(0, 500) : null,
            proxyUrl: proxyUrl,
            originalUrl: url
        });
    }
};

// 诊断函数：测试网络连通性
window.diagFetch = async function() {
    var results = {};
    // 测试 1: 直接访问 GitHub Pages
    try {
        var r = await fetch('https://yinghuatu.github.io/cbb-releases/android_proxy.html');
        results.github = { status: r.status, ok: r.ok };
    } catch(e) {
        results.github = { error: e.message };
    }
    // 测试 2: 访问 corsproxy.io 首页
    try {
        var r = await fetch('https://corsproxy.io/');
        results.corsproxy = { status: r.status, ok: r.ok };
    } catch(e) {
        results.corsproxy = { error: e.message };
    }
    // 测试 3: 通过 corsproxy 访问 Supabase
    try {
        var supUrl = 'https://corsproxy.io/?url=' + encodeURIComponent('https://idydgwgigckjtoemssdr.supabase.co/rest/v1/');
        var r = await fetch(supUrl);
        results.supabaseViaCors = { status: r.status, ok: r.ok };
    } catch(e) {
        results.supabaseViaCors = { error: e.message };
    }
    // 测试 4: 直接访问 Supabase（不走代理）
    try {
        var r = await fetch('https://idydgwgigckjtoemssdr.supabase.co/rest/v1/');
        results.supabaseDirect = { status: r.status, ok: r.ok };
    } catch(e) {
        results.supabaseDirect = { error: e.message };
    }
    return JSON.stringify(results);
};
</script>
</body>
</html>
